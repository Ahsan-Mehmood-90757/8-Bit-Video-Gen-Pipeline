<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retro Sim v3 (Visual-First) — 1080x1920</title>
<!--
  V3 Visual-First host page. Reuses the v2 core (engine/ is never modified by v3) and layers on:
    engine_v3/sfx_presets_v3.js   rhythm voices + UI sounds
    engine_v3/audio_events_v3.js  logSfxV3 / logSynthStateV3 / logBeatPulseV3
    engine_v3/micro_text.js       impact micro-text, hook banner, payoff stamp, beat clock, 900x1420 safe zone
  URL parameters:
    sim=<episode simulation.js>   timeline=<episode build/timeline.js>   (paths relative to this file)
    theme=<channels/<slug>/theme.js>  sfx=<channels/<slug>/sfx_presets.js>  (optional channel kit)
    render=1 (driven by pipeline_v3/render_v3.py)   qa=3 (safe-zone guides)   crt=0
  Preview in Chrome/Edge:
    engine_v3/sim_base_v3.html?sim=../episodes_v3/test_ring_buffer_v3/simulation.js&timeline=../episodes_v3/test_ring_buffer_v3/build/timeline.js
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: ui-monospace, Consolas, monospace; }
  #wrap { position: relative; height: 100vh; aspect-ratio: 9 / 16; margin: 0 auto; }
  #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #0B0F19; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FACC15;
             background: rgba(11,15,25,0.55); font-size: 22px; letter-spacing: 2px; cursor: pointer; text-align: center; }
  #hud { position: fixed; left: 8px; bottom: 6px; color: #64748B; font-size: 12px; }
  #err { position: fixed; top: 10px; left: 10px; right: 10px; color: #F43F5E; white-space: pre-wrap; font-size: 14px; }
  body.render #overlay, body.render #hud { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1080" height="1920"></canvas>
  <div id="overlay">CLICK TO START (V3 VISUAL-FIRST)<br>(space: pause · R: restart · C: CRT · ←/→: seek)</div>
</div>
<div id="hud"></div>
<div id="err"></div>

<script src="../engine/sfx_presets.js"></script>
<script src="sfx_presets_v3.js"></script>
<script src="../engine/retro_audio.js"></script>
<script src="audio_events_v3.js"></script>
<script src="../engine/retro_engine.js"></script>
<script src="../engine/camera_ui.js"></script>
<script src="micro_text.js"></script>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  if (p.get('render') === '1') document.body.classList.add('render');
  const load = (src) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
  const fail = (e) => {
    document.getElementById('err').textContent = String(e && e.stack || e);
    window.__simError = String(e && e.message || e);
    console.error(e);
  };
  window.addEventListener('error', (e) => fail(e.error || e.message));
  (async () => {
    try {
      if (p.get('sfx')) await load(p.get('sfx')).catch(e => console.warn('[sfx] ' + e.message));
      if (p.get('theme')) await load(p.get('theme'));
      if (p.get('timeline')) await load(p.get('timeline')).catch(e => console.warn('[timeline] ' + e.message + ' — using default beats'));
      if (p.get('sim')) await load(p.get('sim'));
      Retro.boot();
    } catch (e) { fail(e); }
  })();
})();
</script>
</body>
</html>
